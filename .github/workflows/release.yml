name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 1.0.1)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  validate-tag:
    name: Validate Release Version
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.resolve_version.outputs.release_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release version
        id: resolve_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            CANDIDATE="$REF_NAME"
            if [[ ! "$CANDIDATE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid semver tag: $CANDIDATE"
              exit 1
            fi
          else
            CANDIDATE="$INPUT_VERSION"
            if [[ ! "$CANDIDATE" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid manual release version: $CANDIDATE"
              exit 1
            fi
          fi

          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NORMALIZED_VERSION="${CANDIDATE#v}"
          RELEASE_VERSION="v${NORMALIZED_VERSION}"
          if [[ "$NORMALIZED_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release version $RELEASE_VERSION does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Validated release version $RELEASE_VERSION"

  build-and-test:
    name: Build & Test for Release
    needs: validate-tag
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexsona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexsona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEXSONA_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/lexsona_test
      LEXSONA_TEST_POSTGRES_SCHEMA: lexsona_release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Create tarball
        run: npm pack

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: smartergpt-lexsona-*.tgz
          retention-days: 7
          if-no-files-found: error

  # NOTE: npm publish is done manually (2FA requires interactive auth).
  # Run: cd /srv/lex-mcp/lexsona && npm publish --access restricted
  # Uncomment when granular access token with publish scope is configured.
