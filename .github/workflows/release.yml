name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version from package.json (for example, 2.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-identity:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Validate package and event identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [ "$EVENT_NAME" = "push" ]; then
            if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
              echo "Tag $RELEASE_TAG does not exactly match package v$PACKAGE_VERSION"
              exit 1
            fi
          elif [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$REQUESTED_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Requested version does not exactly match package $PACKAGE_VERSION"
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$WORKFLOW_REF" != "refs/heads/main" ]; then
              echo "Candidate dispatch is permitted only from refs/heads/main"
              exit 1
            fi
            git fetch --no-tags origin main
            if [ "$WORKFLOW_SHA" != "$(git rev-parse origin/main)" ]; then
              echo "Candidate dispatch must target the current origin/main tip"
              exit 1
            fi
          fi

      - name: Verify authorized signed tag on main
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_SHA: ${{ github.sha }}
          TRUSTED_GPG_KEYS: ${{ secrets.TRUSTED_GPG_KEYS }}
          TRUSTED_RELEASE_FINGERPRINTS: ${{ secrets.TRUSTED_RELEASE_FINGERPRINTS }}
        run: |
          set -euo pipefail
          if [ -z "$TRUSTED_GPG_KEYS" ] || [ -z "$TRUSTED_RELEASE_FINGERPRINTS" ]; then
            echo "TRUSTED_GPG_KEYS and TRUSTED_RELEASE_FINGERPRINTS are required"
            exit 1
          fi
          if [ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]; then
            echo "Release tag must be annotated"
            exit 1
          fi
          echo "$TRUSTED_GPG_KEYS" | base64 -d | gpg --import
          VERIFY_OUTPUT=$(git verify-tag --raw "$RELEASE_TAG" 2>&1)
          printf '%s\n' "$VERIFY_OUTPUT"
          FINGERPRINT=$(printf '%s\n' "$VERIFY_OUTPUT" | awk '$2 == "VALIDSIG" { print toupper($3); exit }')
          if [[ ! "$FINGERPRINT" =~ ^[0-9A-F]{40}$ ]]; then
            echo "Could not resolve one valid tag signer fingerprint"
            exit 1
          fi
          ALLOWED=$(printf '%s' "$TRUSTED_RELEASE_FINGERPRINTS" | tr ',;\r\n' '    ' | tr '[:lower:]' '[:upper:]')
          case " $ALLOWED " in
            *" $FINGERPRINT "*) ;;
            *) echo "Tag signer fingerprint is not authorized"; exit 1 ;;
          esac
          TARGET=$(git rev-list -n 1 "$RELEASE_TAG")
          if [ "$TARGET" != "$WORKFLOW_SHA" ]; then
            echo "Tag target does not match workflow commit"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$TARGET" origin/main; then
            echo "Tag target is not contained in origin/main"
            exit 1
          fi

  build-candidate:
    name: Build, verify, and attest candidate
    needs: validate-identity
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lexsona_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lexsona_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEXSONA_TEST_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/lexsona_test
      LEXSONA_TEST_POSTGRES_SCHEMA: lexsona_release
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Pin npm used for candidate bytes
        run: npm install --global npm@11.11.0

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build native dependencies
        run: npm rebuild better-sqlite3-multiple-ciphers esbuild

      - name: Run the clean full gate
        run: npm run ci:full

      - name: Create and verify the commit-bound candidate
        run: npm run release:candidate

      - name: Attest retained candidate and receipt
        id: attest-candidate
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            smartergpt-lexsona-*.tgz
            release-candidate.json

      - name: Stage attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest-candidate.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" ./release-candidate.attestation.jsonl

      - name: Upload immutable candidate evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            smartergpt-lexsona-*.tgz
            release-candidate.json
            release-candidate.attestation.jsonl
          retention-days: 7
          if-no-files-found: error

  create-github-release:
    name: Verify publication and create GitHub release
    needs: build-candidate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit
          disable-sudo: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.14.1"
          registry-url: "https://registry.npmjs.org"

      - name: Download exact candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: npm-candidate-${{ github.sha }}
          path: .

      - name: Verify candidate receipt and attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/verify-release-candidate.mjs --check-only
          TARBALL=$(node -p "require('./release-candidate.json').artifact.filename")
          gh attestation verify "$TARBALL" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --bundle release-candidate.attestation.jsonl
          gh attestation verify release-candidate.json --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$GITHUB_SHA" --deny-self-hosted-runners --bundle release-candidate.attestation.jsonl

      - name: Bind release to exact private npm bytes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_READ_TOKEN is required for private publication verification"
            exit 1
          fi
          node scripts/verify-published-candidate.mjs

      - name: Generate changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log "$PREV_TAG..$RELEASE_TAG" --pretty=format:"- %s (%h)" > CHANGELOG.txt
          else
            git log --pretty=format:"- %s (%h)" > CHANGELOG.txt
          fi

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
