# Minimal CI: lint + typecheck only
# To run full CI: use workflow_dispatch with 'level' input
# Local equivalents:
#   minimal: npm run ci:minimal
#   standard: npm run ci
#   full: npm run ci:full
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: 'CI level to run'
        required: false
        type: choice
        options:
          - minimal
          - standard
          - full
        default: 'minimal'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Minimal gates: lint + typecheck (always runs)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  # Standard gates: build + tests (only on workflow_dispatch with level >= standard)
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: >-
      github.event_name == 'workflow_dispatch' && 
      (inputs.level == 'standard' || inputs.level == 'full')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Full gates: determinism check (only on workflow_dispatch with level == full)
  determinism-check:
    name: Determinism Check
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.level == 'full'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run format || true
      - name: Check for uncommitted changes
        run: git diff --exit-code || (echo "Error: Build or format produced uncommitted changes" && exit 1)

  # Summary job
  ci-complete:
    name: CI Complete
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    if: always()
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "❌ Lint failed"; exit 1
          fi
          if [[ "${{ needs.typecheck.result }}" != "success" ]]; then
            echo "❌ TypeCheck failed"; exit 1
          fi
          echo "✅ CI Complete (level: ${{ inputs.level || 'minimal' }})"
