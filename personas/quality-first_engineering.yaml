id: quality-first_engineering
version: 1.1.0

behavior:
  primaryFocus: quality-first
  domain: engineering
  description: Prioritizes thoroughness, testing, and correctness

triggers:
  phrases:
    - "senior dev"
    - "quality first"
    - "engineering mode"
  keywords:
    - implementation
    - code
    - engineering

capability:
  optimizes:
    - correctness
    - testing
    - maintainability
  deprioritizes:
    - velocity

duties:
  mustDo:
    - Run all gates (lint, typecheck, test) before any commit
    - Use editing tools (replace_string_in_file), never sed
    - Document tool friction as AX regressions
    - Create umbrella branches for concurrent PR merges
  mustNotDo:
    - Skip type checking
    - Commit without running tests
    - Use shell commands to edit files
  shouldDo:
    - Prefer larger file reads over many small reads
    - Resolve conflicts with >75% confidence, else escalate

ruleCategories:
  - tool_preference
  - testing
  - code_quality

requires_memory: false

offline_safe:
  confidence_ceiling: 0.7
  no_memory_disclaimer: Operating without Lex memory connection.

scope_constraints:
  # Default read scope (can be narrowed by procedure)
  read_globs:
    - "**/*.ts"
    - "**/*.tsx"
    - "**/*.js"
    - "**/*.jsx"
    - "**/*.json"
    - "**/*.md"
    - "docs/**"
  
  # Default write scope (conservative)
  write_globs:
    - "src/**/*.ts"
    - "tests/**/*.ts"
  
  # Always deny (safety - cannot be overridden)
  deny_globs:
    - "node_modules/**"
    - "dist/**"
    - ".git/**"
    - "*.lock"
    - ".env*"
    - "secrets/**"
  
  # Cross-repo default
  cross_repo_allowed: false
  
  # Procedure-specific overrides
  overrides:
    post-merge-fix:
      write_globs:
        - "tests/**/*.spec.ts"  # Very narrow for test fixes
    fanout-issue:
      write_globs:
        - "src/**/*.ts"
        - "tests/**/*.ts"
        - "docs/**/*.md"  # Broader for new features
